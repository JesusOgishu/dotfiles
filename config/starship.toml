add_newline = true
format = """
[   $directory  $git_branch ](bg:sapphire fg:text)[](sapphire)$character"""
right_format = """[](sapphire)[ ${custom.spotify}$time  $battery ](bg:sapphire fg:text)"""
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#3b6ea5"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[directory]
style             = "bg:sapphire fg:text"
truncation_length = 1
format            = "[$path]($style)"

[git_branch]
format = "[ $branch]($style)"
style  = "bg:sapphire fg:text"

[time]
disabled    = false
format      = "[$time]($style)"
style       = "bg:sapphire fg:text"
time_format = "%I:%M:%S %p"

[character]
success_symbol = " [❯](sky)"
error_symbol   = " [❯](red)"

[custom.spotify]
description = "Cancion sonando en Spotify"
command     = "~/.config/starship-spotify.sh"
when        = true
shell       = ["bash", "--noprofile", "--norc"]
symbol      = "  "
style       = "bg:sapphire fg:text"
format      = "[$symbol$output  ]($style)"

[battery]
full_symbol        = " "
charging_symbol    = " "
discharging_symbol = " "
unknown_symbol     = " "
empty_symbol       = " "
format             = "[$percentage]($style)"

[[battery.display]]
threshold = 100
style     = "bg:sapphire fg:text"
